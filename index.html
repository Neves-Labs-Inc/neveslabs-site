<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Neves Labs</title>
    <style>
      :root {
        --color-bg: #f4f4f2;
        --color-fg: #161614;
        --color-fg-2: #5e5e58;
        --color-accent: #0f766e;
        --font-sans: "IBM Plex Sans", system-ui, sans-serif;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --color-bg: #0c0c0b;
          --color-fg: #ecece8;
          --color-fg-2: #9c9c95;
          --color-accent: #2dd4bf;
        }
      }
      * { margin: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--color-bg);
        color: var(--color-fg);
        font-family: var(--font-sans);
        text-align: center;
      }
      h1 { font-size: 2rem; font-weight: 600; letter-spacing: -0.01em; }
      h1::after {
        content: "";
        display: block;
        width: 2rem;
        height: 3px;
        margin: 0.75rem auto;
        background: var(--color-accent);
      }
      p { color: var(--color-fg-2); }
    </style>
  </head>
  <body>
    <main>
      <h1>Neves Labs</h1>
      <p>Coming soon</p>
    </main>
  </body>
</html>
